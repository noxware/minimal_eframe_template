[package]
name = "app"
version = "0.1.0"
edition = "2024"

[dependencies]
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
] }
log = "0.4.34"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
